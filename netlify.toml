# MUGI public website on Netlify: the repo root is the site (no build step).
# The admin portal is a separate repo and Netlify site (mugi_admin); it
# publishes by committing content/site.json here, which redeploys this site.
[build]
  publish = "."

# content changes must show up as soon as a deploy finishes
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# working files that shouldn't be served
[[redirects]]
  from = "/design-options/*"
  to = "/404"
  status = 404
  force = true

# the feedback function's source (it runs at /.netlify/functions/feedback)
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

# The reservation form posts to /api/reservations on this site; Netlify passes
# it to the admin portal's API, which stores the booking and emails the
# branch. Same address, so the browser makes no cross-origin request. Change
# the address below if the admin portal moves to a custom domain.
[[redirects]]
  from = "/api/*"
  to = "https://mugiportal.netlify.app/api/:splat"
  status = 200
  force = true
